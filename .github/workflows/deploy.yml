name: Deploy pocketCFO to VM

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (WeasyPrint runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libjpeg-dev libopenjp2-7-dev libffi-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run unit tests
        env:
          APP_ENV: test
          APP_SECRET_KEY: test-secret
          APP_HOST: 0.0.0.0
          APP_PORT: "8888"
          APP_DEBUG: "false"
          DATABASE_URL: "postgresql+asyncpg://user:pass@localhost:5432/testdb"
          GEMINI_API_KEY: test
          GEMINI_MODEL: test
          SINOPAC_API_BASE_URL: "http://test"
          SINOPAC_ACCOUNT_ID: test
          SINOPAC_API_KEY: test
          SINOPAC_API_SECRET: test
          SINOPAC_CERT_PATH: test
          SINOPAC_CERT_PASSWORD: test
          TAISHIN_API_BASE_URL: "http://test"
          TAISHIN_ACCOUNT_ID: test
          TAISHIN_API_KEY: test
          TAISHIN_API_SECRET: test
          TAISHIN_CERT_PATH: test
          TAISHIN_CERT_PASSWORD: test
          UPLOAD_DIR: /tmp/uploads
          MAX_UPLOAD_SIZE_MB: "50"
          CORS_ORIGINS: '["*"]'
          INTERNAL_ACCOUNT_IDS: "[]"
        run: pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ghcr.io/chiehhuiwei/pocketcfo-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/chiehhuiwei/pocketcfo-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            cat << 'EOF' > docker-compose.prod.yml
            version: "3.9"
            
            services:
              backend:
                platform: linux/amd64
                image: ghcr.io/chiehhuiwei/pocketcfo-backend:latest
                ports:
                  - "8888:8888"
                volumes:
                  - ./uploads:/app/uploads
                  - ./secrets:/app/secrets
                env_file:
                  - .env
                depends_on:
                  db:
                    condition: service_healthy
                restart: unless-stopped
            
              db:
                image: postgres:17
                environment:
                  POSTGRES_USER: pocketcfo
                  POSTGRES_DB: pocketcfo
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
                volumes:
                  - pgdata:/var/lib/postgresql/data
                  - ./backups:/backups
                ports:
                  - "127.0.0.1:5432:5432"
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U pocketcfo -d pocketcfo"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                restart: unless-stopped
            
              db-backup:
                image: postgres:17
                environment:
                  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
                volumes:
                  - ./backups:/backups
                depends_on:
                  db:
                    condition: service_healthy
                # Daily dump at container start + every 24h; keep the last 14
                entrypoint: >
                  sh -c 'while true; do
                  pg_dump -h db -U pocketcfo -d pocketcfo -Fc -f /backups/pocketcfo-$$(date +%Y%m%d-%H%M).dump &&
                  ls -1t /backups/pocketcfo-*.dump | tail -n +15 | xargs -r rm -f;
                  sleep 86400; done'
                restart: unless-stopped
            
              frontend:
                image: ghcr.io/chiehhuiwei/pocketcfo-frontend:latest
                ports:
                  - "5173:5173"
                depends_on:
                  - backend
                restart: unless-stopped
            
            volumes:
              pgdata:
            EOF
            
            # Log in to GHCR on VM using GH_PAT secret
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull and restart containers using production compose
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            
            # Clean up old unused images and stopped containers to free VM disk space
            docker system prune -f
