version: "3.9"

services:
  backend:
    platform: linux/amd64
    image: ghcr.io/chiehhuiwei/pocketcfo-backend:latest
    ports:
      - "8888:8888"
    volumes:
      - ./uploads:/app/uploads
      - ./secrets:/app/secrets
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pocketcfo
      POSTGRES_DB: pocketcfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketcfo -d pocketcfo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-backup:
    image: postgres:17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Daily dump at container start + every 24h; keep the last 14
    entrypoint: >
      sh -c 'while true; do
      pg_dump -h db -U pocketcfo -d pocketcfo -Fc -f /backups/pocketcfo-$$(date +%Y%m%d-%H%M).dump &&
      ls -1t /backups/pocketcfo-*.dump | tail -n +15 | xargs -r rm -f;
      sleep 86400; done'
    restart: unless-stopped

  frontend:
    image: ghcr.io/chiehhuiwei/pocketcfo-frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
