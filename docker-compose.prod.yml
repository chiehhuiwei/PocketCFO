version: "3.9"

services:
  backend:
    platform: linux/amd64
    image: ghcr.io/chiehhuiwei/pocketcfo-backend:latest
    ports:
      - "8888:8888"
    volumes:
      - ./uploads:/app/uploads
      - ./secrets:/app/secrets
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pocketcfo
      POSTGRES_DB: pocketcfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketcfo -d pocketcfo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ghcr.io/chiehhuiwei/pocketcfo-frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
